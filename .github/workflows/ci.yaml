name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2.7.0

      - name: ct lint
        run: ct lint --config ct.yaml --all

      - name: helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.7.2
          for chart in charts/*/; do helm unittest "$chart"; done

      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for chart in charts/*/; do
            for values in "$chart"ci/*.yaml; do
              echo "::group::$values"
              helm template ci "$chart" -f "$values" | ./kubeconform -strict -summary \
                -kubernetes-version 1.31.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
              echo "::endgroup::"
            done
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: helm-docs is up to date
        run: |
          curl -sSL https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz | tar xz helm-docs
          ./helm-docs --chart-search-root charts
          git diff --exit-code -- charts
